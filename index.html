<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表紙</title>
<style>
  :root { --bg:#eef5ff; --fg:#1f2d3d; --accent:#2563eb; --card:#fff; --line:#cfe0f7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101a2b; --fg:#e6eefb; --accent:#6ea8fe; --card:#1a2740; --line:#2c3f5e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
         font-family:system-ui,"Yu Gothic",sans-serif; display:flex; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:420px; }
  h1 { text-align:center; margin:24px 0 28px; font-size:1.6rem; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
  li { display:flex; align-items:center; justify-content:space-between; gap:12px;
       background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:1.1rem; }
  .name { flex:1; }
  .link { color:var(--accent); text-decoration:underline; text-underline-offset:4px; font-weight:600; }
  .link::after { content:" ›"; }
  .link:hover { opacity:.75; }
  .start { display:block; font-size:.75rem; opacity:.6; margin-top:2px; }
  .hh { position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:1; }
  button, a { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  @media (max-width:480px) {
    body { padding:16px 12px; }
    h1 { font-size:1.35rem; margin:16px 0 20px; }
    .sub { margin:-8px 0 12px; font-size:.9rem; }
    .row { padding:12px; }
    li.wrap .link { font-size:1.05rem; }
    .icons > span { width:min(21vw, 86px); }
    .g { width:36px; height:36px; }
    .plus { width:44px; height:44px; }
    .hh { font-size:.65rem; }
    input, .toggle { font-size:16px; }
  }
  .backup { display:flex; gap:8px; margin-top:28px; }
  .backup button { flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font-size:.85rem; }
  .note { font-size:.72rem; opacity:.6; margin-top:8px; text-align:center; }
  .batchcard { display:block; margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; text-decoration:none; color:inherit; font-size:1.1rem; }
  .g.done.on { background:#34a853; border-color:#34a853; color:#fff; }
  .blist li.bitem { display:flex; justify-content:space-between; align-items:center; padding:8px 14px; }
  .blist li.struck span:first-child { text-decoration:line-through; opacity:.5; }
  .bhead { margin-bottom:6px; }
  .bq { margin-bottom:12px; width:100%; }
  .blist { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  .blist li { display:block; padding:12px 14px; font-size:1.05rem; }
  .back { background:transparent; border:none; color:var(--accent); font-size:1rem; padding:8px 0; }
  .sub { text-align:center; opacity:.7; margin:-16px 0 16px; }
  li.wrap { display:block; padding:0; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; }
  .hist { border-top:1px solid var(--line); padding:8px 0 24px; display:grid; gap:6px; }
  .hist .h { display:flex; justify-content:space-between; align-items:center; padding:4px 0; }
  .g { width:32px; height:32px; border-radius:50%; border:2px solid var(--line); background:transparent; color:transparent; font-weight:700; }
  .g.on { background:#4285f4; border-color:#4285f4; color:#fff; }
  .hh { display:flex; justify-content:space-between; align-items:center; padding:0; font-size:.75rem; opacity:.7; font-weight:600; }
  .icons { gap:0; }
  .icons > span { width:58px; display:flex; justify-content:center; text-align:center; white-space:nowrap; }
  .icons { display:flex; gap:8px; }
  .g.x { color:#999; border-color:#bbb; }
  .g.x.on { background:#9e9e9e; border-color:#9e9e9e; color:#fff; }
  .h.struck span:first-child { text-decoration:line-through; opacity:.5; }
  .g.two.on { background:#34a853; border-color:#34a853; }
  .count { min-width:2ch; text-align:right; opacity:.7; font-variant-numeric:tabular-nums; }
  button { font:inherit; cursor:pointer; }
  .plus { width:40px; height:40px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:1.5rem; line-height:1; }
  .plus:active { transform:scale(.92); }
  .register { margin-top:12px; }
  .register > button.toggle { width:100%; text-align:left; background:transparent; color:var(--fg);
       border:2px dashed var(--line); border-radius:12px; padding:14px 16px; font-size:1.1rem; display:flex; justify-content:space-between; align-items:center; }
  form { display:none; gap:8px; margin-top:10px; }
  form.open { display:flex; }
  input { flex:1; min-width:0; font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  form button { padding:10px 16px; border:none; border-radius:8px; background:var(--accent); color:#fff; }
</style>
</head>
<body>
<main>
  <div id="detail" hidden></div>
  <div id="cover">
  <h1>表紙</h1>
  <ul id="list"></ul>
  <div class="register">
    <button class="toggle" id="toggle" type="button"><span>新規登録</span><span>+</span></button>
    <form id="form">
      <input id="newName" placeholder="名前を入力" maxlength="30" required>
      <button type="submit">登録</button>
    </form>
  </div>
  <a class="batchcard" href="#/batch"><span class="link">バッチ連携</span><small class="start">成功リスト（毎日自動更新）</small></a>
  <div class="backup">
    <button type="button" id="export">バックアップを保存</button>
    <button type="button" id="import">バックアップを読み込む</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </div>
  <div class="note" id="note"></div>
  </div>
</main>
<script>
  const KEY = "cover-app-v8";
  const mk = n => ({ start: n, name: n, g: {}, t: {}, x: {}, open: false });
  let items;
  try { items = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!Array.isArray(items)) items = [Object.assign(mk("nekomes0001"), { name: "nekomes1560" }), Object.assign(mk("001nyames"), { name: "680nyames" })];

  // 名前修正の移行: 001nyas系 → 001nyames系
  const fix = v => typeof v === "string" ? v.replace(/^(\d+)nyas$/, "$1nyames") : v;
  const fixKeys = o => Object.fromEntries(Object.entries(o || {}).map(([k, v]) => [fix(k), v]));
  items.forEach(it => { if (it.start === "001nyas") { it.start = fix(it.start); it.name = fix(it.name); it.g = fixKeys(it.g); it.t = fixKeys(it.t); it.x = fixKeys(it.x); } });
  save();

  const list = document.getElementById("list");
  const form = document.getElementById("form");

  function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }

  const parse = n => { const m = n.match(/^(.*?)(\d+)(.*)$/s); return m ? { pre: m[1], num: BigInt(m[2]), w: m[2].length, suf: m[3] } : null; };
  const fmt = (p, n) => p.pre + String(n).padStart(p.w, "0") + p.suf;

  function bump(n) {
    const p = parse(n);
    return p ? fmt(p, p.num + 1n) : n + "1";
  }

  // start から現在までの名前一覧
  function history(it) {
    const a = parse(it.start), b = parse(it.name);
    if (!a || !b) return it.start === it.name ? [it.start] : [it.start, it.name];
    const out = [];
    for (let n = a.num; n <= b.num && out.length < 5000; n++) out.push(fmt(a, n));
    return out;
  }

  function render() {
    const m = location.hash.match(/^#\/(\d+)$/);
    const idx = m ? +m[1] : -1;
    if (location.hash === "#/batch") { document.getElementById("cover").hidden = true; document.getElementById("detail").hidden = false; return renderBatch(); }
    document.getElementById("cover").hidden = idx >= 0 && !!items[idx];
    document.getElementById("detail").hidden = !(idx >= 0 && items[idx]);
    if (idx >= 0 && items[idx]) return renderDetail(idx);
    document.title = "表紙";
    list.innerHTML = "";
    items.forEach((it, i) => {
      const li = document.createElement("li"); li.className = "wrap";
      const row = document.createElement("div"); row.className = "row";
      const name = document.createElement("div"); name.className = "name";
      const a = document.createElement("a"); a.className = "link"; a.textContent = it.name; a.href = "#/" + i;
      const st = document.createElement("small"); st.className = "start"; st.textContent = "開始: " + it.start;
      name.append(a, st);
      const btn = document.createElement("button"); btn.className = "plus"; btn.textContent = "+";
      btn.setAttribute("aria-label", it.name + " に追加");
      btn.onclick = () => { it.name = bump(it.name); save(); render(); };
      row.append(name, btn);
      li.append(row);
      list.append(li);
    });
  }

  function renderBatch() {
    const box = document.getElementById("detail");
    document.title = "バッチ連携";
    box.innerHTML = "";
    const back = document.createElement("button"); back.className = "back"; back.textContent = "← 戻る";
    back.onclick = () => { location.hash = ""; };
    const h = document.createElement("h1"); h.textContent = "バッチ連携";
    const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = "読み込み中…";
    const rl = document.createElement("button"); rl.className = "back"; rl.style.display = "block"; rl.style.margin = "0 auto 8px"; rl.textContent = "↻ 更新";
    const q = document.createElement("input"); q.type = "search"; q.placeholder = "絞り込み"; q.className = "bq";
    const ul = document.createElement("ul"); ul.className = "blist";
    const msg = document.createElement("div"); msg.className = "sub"; msg.hidden = true;
    let data = [], meta = "";
    const BK = "batch-marks-v1";
    let marks = {};
    try { marks = JSON.parse(localStorage.getItem(BK)) || {}; } catch (e) {}
    const saveM = () => { try { localStorage.setItem(BK, JSON.stringify(marks)); } catch (e) {} };
    const cnt = () => { sub.textContent = data.length ? meta + "（済: " + data.filter(x => marks[x] && marks[x].d).length + " / ✕: " + data.filter(x => marks[x] && marks[x].x).length + "）" : meta; };
    const mkBtn = (name, key, label, cls, li) => {
      const b = document.createElement("button"); b.className = "g " + cls + ((marks[name] || {})[key] ? " on" : ""); b.textContent = label;
      b.setAttribute("aria-pressed", !!(marks[name] || {})[key]);
      b.onclick = () => {
        const m = marks[name] = marks[name] || {};
        if (m[key]) delete m[key]; else m[key] = true;
        if (!m.d && !m.x) delete marks[name];
        saveM();
        b.classList.toggle("on", !!(marks[name] || {})[key]); b.setAttribute("aria-pressed", !!(marks[name] || {})[key]);
        li.classList.toggle("struck", !!(marks[name] || {}).x);
        cnt();
      };
      return b;
    };
    const draw = () => {
      const k = q.value.trim().toLowerCase();
      const shown = k ? data.filter(x => x.toLowerCase().includes(k)) : data;
      ul.innerHTML = "";
      shown.forEach(x => {
        const li = document.createElement("li"); li.className = "bitem" + ((marks[x] || {}).x ? " struck" : "");
        const t = document.createElement("span"); t.textContent = x;
        const ic = document.createElement("div"); ic.className = "icons";
        [mkBtn(x, "d", "済", "done", li), mkBtn(x, "x", "✕", "x", li)].forEach(b => { const c = document.createElement("span"); c.append(b); ic.append(c); });
        li.append(t, ic); ul.append(li);
      });
      msg.hidden = shown.length > 0; msg.textContent = data.length ? "該当なし" : "データがありません";
    };
    const load = async () => {
      sub.textContent = "読み込み中…";
      try {
        const r = await fetch("list.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw 0;
        const d = await r.json();
        data = Array.isArray(d.items) ? d.items : [];
        meta = data.length + "件 ・ 更新 " + (d.updated || "不明");
      } catch (e) { data = []; meta = "読み込めませんでした"; }
      cnt(); draw();
    };
    q.oninput = draw; rl.onclick = load;
    const head = document.createElement("div"); head.className = "hh bhead";
    head.innerHTML = "<span>番号</span><div class='icons'><span>済</span><span>使用不可</span></div>";
    box.append(back, h, sub, rl, q, head, ul, msg);
    load();
  }

  function renderDetail(i) {
    const it = items[i], box = document.getElementById("detail");
    document.title = it.name;
    box.innerHTML = "";
    const back = document.createElement("button"); back.className = "back"; back.textContent = "← 戻る";
    back.onclick = () => { location.hash = ""; };
    const h = document.createElement("h1"); h.textContent = it.name;
    const all = history(it);
    const sub = document.createElement("div"); sub.className = "sub";
    it.t = it.t || {}; it.x = it.x || {};
    const cnt = () => { sub.textContent = all.length + "件（2回目: " + all.filter(y => it.t[y]).length + " / Google: " + all.filter(y => it.g[y]).length + "）"; };
    cnt();
    const hist = document.createElement("div"); hist.className = "hist";
    const head = document.createElement("div"); head.className = "hh";
    head.innerHTML = "<span>番号</span><div class='icons'><span>Google</span><span>2回目</span><span>使用不可</span></div>";
    hist.append(head);
    const toggle = (store, label, cls, x, row) => {
      const b = document.createElement("button"); b.className = "g " + cls + (store[x] ? " on" : ""); b.textContent = label;
      b.setAttribute("aria-pressed", !!store[x]);
      b.onclick = () => {
        if (store[x]) delete store[x]; else store[x] = true;
        save();
        b.classList.toggle("on", !!store[x]); b.setAttribute("aria-pressed", !!store[x]);
        if (row) row.classList.toggle("struck", !!store[x]);
        cnt();
      };
      return b;
    };
    all.slice().reverse().forEach(x => {
      const r = document.createElement("div"); r.className = "h";
      const t = document.createElement("span"); t.textContent = x;
      const ic = document.createElement("div"); ic.className = "icons";
      [toggle(it.g, "G", "gg", x), toggle(it.t, "2", "two", x), toggle(it.x, "✕", "x", x, r)].forEach(b => { const c = document.createElement("span"); c.append(b); ic.append(c); });
      if (it.x[x]) r.classList.add("struck");
      r.append(t, ic); hist.append(r);
    });
    box.append(back, h, sub, hist);
  }

  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

  document.getElementById("toggle").onclick = () => {
    form.classList.toggle("open");
    if (form.classList.contains("open")) document.getElementById("newName").focus();
  };
  form.onsubmit = e => {
    e.preventDefault();
    const v = document.getElementById("newName").value.trim();
    if (!v) return;
    items.push(mk(v));
    save(); render();
    form.reset(); form.classList.remove("open");
  };
  // 消えにくくする: 永続ストレージを要求
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  document.getElementById("export").onclick = () => {
    const blob = new Blob([JSON.stringify(items)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    document.getElementById("note").textContent = "バックアップを保存しました（ダウンロードフォルダ）";
  };
  document.getElementById("import").onclick = () => document.getElementById("file").click();
  document.getElementById("file").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d) || !d.every(x => x && typeof x.name === "string" && typeof x.start === "string")) throw 0;
        if (!confirm("今のデータをバックアップの内容で置き換えます。よろしいですか？")) return;
        items = d.map(x => Object.assign(mk(x.start), x, { g: x.g || {}, t: x.t || {}, x: x.x || {} }));
        save(); location.hash = ""; render();
        document.getElementById("note").textContent = "読み込みました";
      } catch (err) { alert("バックアップファイルを読み込めませんでした"); }
    };
    r.readAsText(f); e.target.value = "";
  };
  render();
</script>
</body>
</html>
